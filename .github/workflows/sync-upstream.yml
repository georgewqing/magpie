name: Sync Upstream

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/yetone/magpie.git
          git fetch upstream main

      - name: Merge upstream into main
        id: merge
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout main
          if git merge --no-edit upstream/main; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push merged main
        if: steps.merge.outputs.merged == 'true'
        run: git push origin main

      - name: Open sync PR on conflict
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B sync-upstream upstream/main
          git push --force origin sync-upstream
          PR=$(gh pr list --head sync-upstream --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title 'chore: sync upstream main (conflict)' \
              --body 'Automated upstream sync hit a conflict. Please resolve manually.'
          else
            gh pr create --base main --head sync-upstream \
              --title 'chore: sync upstream main (conflict)' \
              --body 'Automated upstream sync hit a conflict. Please resolve manually.'
          fi
